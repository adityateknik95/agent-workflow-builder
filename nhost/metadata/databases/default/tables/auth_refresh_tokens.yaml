# Tracked by the nhost auth service. Included here so that applying this
# metadata directory (which replaces metadata wholesale) does not untrack the
# tables hasura-auth needs, and so no client role is ever granted access to them.
table:
  name: refresh_tokens
  schema: auth
configuration:
  column_config:
    created_at:
      custom_name: createdAt
    expires_at:
      custom_name: expiresAt
    refresh_token_hash:
      custom_name: refreshTokenHash
    user_id:
      custom_name: userId
  custom_column_names:
    created_at: createdAt
    expires_at: expiresAt
    refresh_token_hash: refreshTokenHash
    user_id: userId
  custom_name: authRefreshTokens
  custom_root_fields:
    delete: deleteAuthRefreshTokens
    delete_by_pk: deleteAuthRefreshToken
    insert: insertAuthRefreshTokens
    insert_one: insertAuthRefreshToken
    select: authRefreshTokens
    select_aggregate: authRefreshTokensAggregate
    select_by_pk: authRefreshToken
    update: updateAuthRefreshTokens
    update_by_pk: updateAuthRefreshToken
