table:
  name: workflows
  schema: public
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
  - name: author
    using:
      manual_configuration:
        remote_table:
          name: org_member_profiles
          schema: public
        column_mapping:
          created_by: user_id
          org_id: org_id
array_relationships:
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public
select_permissions:
  - role: viewer
    permission:
      columns: [id, org_id, name, description, is_active, created_by, created_at, updated_at]
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: viewer
      allow_aggregations: true
  - role: editor
    permission:
      columns: [id, org_id, name, description, is_active, created_by, created_at, updated_at]
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: editor
      allow_aggregations: true
  - role: owner
    permission:
      columns: [id, org_id, name, description, is_active, created_by, created_at, updated_at]
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      allow_aggregations: true
insert_permissions:
  # The check is on the org of the row being inserted, so passing another org's
  # id simply fails the permission -- there is no code path that trusts a
  # client-supplied org_id.
  - role: editor
    permission:
      check:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: editor
      columns: [org_id, name, description, is_active]
      set:
        created_by: x-hasura-user-id
  - role: owner
    permission:
      check:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      columns: [org_id, name, description, is_active]
      set:
        created_by: x-hasura-user-id
update_permissions:
  - role: editor
    permission:
      columns: [name, description, is_active]
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: editor
      check:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: editor
  - role: owner
    permission:
      columns: [name, description, is_active]
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      check:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
delete_permissions:
  # Deleting a workflow discards its run history, so it stays with the owner.
  - role: owner
    permission:
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
