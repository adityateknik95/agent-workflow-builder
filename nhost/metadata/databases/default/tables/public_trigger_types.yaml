table:
  name: trigger_types
  schema: public
array_relationships:
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: type
        table:
          name: workflow_triggers
          schema: public
select_permissions:
  - role: viewer
    permission:
      columns: [value, comment, requires_owner]
      filter: {}
  - role: editor
    permission:
      columns: [value, comment, requires_owner]
      filter: {}
  - role: owner
    permission:
      columns: [value, comment, requires_owner]
      filter: {}
