table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: profile
    using:
      manual_configuration:
        remote_table:
          name: org_member_profiles
          schema: public
        column_mapping:
          id: org_member_id
select_permissions:
  - role: user
    permission:
      columns: [id, org_id, user_id, role, created_at]
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: [id, org_id, user_id, role, created_at, updated_at]
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: viewer
  - role: editor
    permission:
      columns: [id, org_id, user_id, role, created_at, updated_at]
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: editor
  - role: owner
    permission:
      columns: [id, org_id, user_id, role, created_at, updated_at]
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
# Membership management is owner-only. There is deliberately no insert, update or
# delete permission for `editor` -- that is the one thing that separates the two
# write-capable roles in layer 1.
insert_permissions:
  - role: owner
    permission:
      check:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      columns: [org_id, user_id, role]
update_permissions:
  - role: owner
    permission:
      columns: [role]
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      check:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
delete_permissions:
  - role: owner
    permission:
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
