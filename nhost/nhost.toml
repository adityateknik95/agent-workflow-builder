# nhost project configuration.
#
# Run `nhost config validate` after cloning: the CLI pins service versions to what
# your installed version supports, and it will tell you if any of these need
# bumping.
#
# The one setting that matters most for this project is the allowed roles list
# under [auth.user.roles]. owner/editor/viewer have to be issuable in a user's
# JWT, because the app asks Hasura to act as one of them per request. Which of
# them a user actually holds for a given organisation is decided by the row
# permissions against org_members, never by the token.
#
# Service versions are deliberately not pinned. A pin that is older than what the
# project already runs is a downgrade, and downgrading auth or storage past their
# own migrations is not safe -- this project was set up against auth 0.49.1 and
# storage 0.14.0, so the platform's defaults are left to win.

[global]

[[global.environment]]
name = 'LLM_PROVIDER'
value = '{{ secrets.LLM_PROVIDER }}'

[[global.environment]]
name = 'LLM_API_KEY'
value = '{{ secrets.LLM_API_KEY }}'

[[global.environment]]
name = 'LLM_MODEL'
value = '{{ secrets.LLM_MODEL }}'

[[global.environment]]
name = 'SLACK_WEBHOOK_URL'
value = '{{ secrets.SLACK_WEBHOOK_URL }}'

[hasura]
adminSecret = '{{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}'
webhookSecret = '{{ secrets.NHOST_WEBHOOK_SECRET }}'

[[hasura.jwtSecrets]]
type = 'HS256'
key = '{{ secrets.HASURA_GRAPHQL_JWT_SECRET }}'

[hasura.settings]
corsDomain = ['*']
devMode = false
enableAllowList = false
enableConsole = true
enableRemoteSchemaPermissions = false
enabledAPIs = ['metadata', 'graphql']
# Anonymous requests resolve as `public`. No table grants that role anything; it
# exists so the inbound webhook Action can be called without a session.
unauthorizedRole = 'public'
stringifyNumericTypes = false

[hasura.logs]
level = 'warn'

[hasura.events]
httpPoolSize = 100

[functions]
[functions.node]
version = 22

[auth]

[auth.redirections]
clientUrl = 'https://agent-workflow-builder-swart.vercel.app'
allowedUrls = [
  'https://agent-workflow-builder-swart.vercel.app',
  'https://agent-workflow-builder-adityateknik95-1198s-projects.vercel.app',
  'http://localhost:3000',
]

[auth.signUp]
enabled = true

[auth.user]
[auth.user.roles]
default = 'user'
allowed = ['user', 'me', 'owner', 'editor', 'viewer']

[auth.user.email]
[auth.user.emailDomains]

[auth.session]
[auth.session.accessToken]
expiresIn = 900

[auth.session.refreshToken]
expiresIn = 2592000

[auth.method]
[auth.method.emailPassword]
emailVerificationRequired = false
hibpEnabled = false
passwordMinLength = 9

[auth.method.emailPasswordless]
enabled = false

[auth.method.anonymous]
enabled = false

[auth.method.webauthn]
enabled = false

[auth.rateLimit]

[postgres]

[postgres.resources]
[postgres.resources.storage]
# 1 GB is what the Starter plan allows, and this schema needs a tiny fraction of
# it. Asking for more than the plan permits fails the deploy outright.
capacity = 1

[provider]

[storage]

[observability]
[observability.grafana]
adminPassword = '{{ secrets.GRAFANA_ADMIN_PASSWORD }}'
