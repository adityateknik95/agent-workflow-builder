# nhost project configuration.
#
# Deliberately minimal. The config schema the cloud validates against is older
# than the one `nhost config validate` uses locally, so anything optional here is
# a chance for a deploy to fail on an unknown field for no benefit. Tuning that
# does not change behaviour (log levels, console flags, event pool sizes) is left
# at the platform defaults, and the two things this project genuinely needs are
# set the version-independent way:
#
#   * owner/editor/viewer must be issuable in a user's JWT -- [auth.user.roles]
#     below. Which of them a user actually holds for a given organisation is
#     decided by the row permissions against org_members, never by the token.
#
#   * anonymous requests must resolve as `public`, because the inbound webhook
#     Action is called with no session. nhost already configures `public` as the
#     unauthorized role, so nothing is set here: an unauthenticated query against
#     the project answers with a schema error rather than an auth error, which is
#     only possible if a role was resolved. `public` is granted no table
#     permissions anywhere, so it can reach that one Action and nothing else.
#
# Service versions are not pinned on purpose. A pin older than what the project
# already runs is a downgrade, and downgrading auth or storage past their own
# migrations is unsafe.

[global]

[[global.environment]]
name = 'LLM_PROVIDER'
value = '{{ secrets.LLM_PROVIDER }}'

[[global.environment]]
name = 'LLM_API_KEY'
value = '{{ secrets.LLM_API_KEY }}'

[[global.environment]]
name = 'LLM_MODEL'
value = '{{ secrets.LLM_MODEL }}'

[[global.environment]]
name = 'SLACK_WEBHOOK_URL'
value = '{{ secrets.SLACK_WEBHOOK_URL }}'

[hasura]
adminSecret = '{{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}'
webhookSecret = '{{ secrets.NHOST_WEBHOOK_SECRET }}'

[[hasura.jwtSecrets]]
type = 'HS256'
key = '{{ secrets.HASURA_GRAPHQL_JWT_SECRET }}'

[functions]
[functions.node]
version = 22

[auth]

[auth.redirections]
clientUrl = 'https://agent-workflow-builder-swart.vercel.app'
allowedUrls = [
  'https://agent-workflow-builder-swart.vercel.app',
  'https://agent-workflow-builder-adityateknik95-1198s-projects.vercel.app',
  'http://localhost:3000',
]

[auth.signUp]
enabled = true

[auth.user]
[auth.user.roles]
default = 'user'
allowed = ['user', 'me', 'owner', 'editor', 'viewer']

[auth.method]
[auth.method.emailPassword]
emailVerificationRequired = false

[postgres]

[postgres.resources]
[postgres.resources.storage]
capacity = 1

# Required by the config schema rather than something this project uses.
[observability]
[observability.grafana]
adminPassword = '{{ secrets.GRAFANA_ADMIN_PASSWORD }}'
